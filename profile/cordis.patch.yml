# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      # Legacy ChatGPT/Codex fallback (pi-ai openai-codex route).
      # The primary route is now dsh-plugin-subscriptions (`codex`) configured
      # in profile/cordis.patch.yml below; this list remains as a fallback.
      openai-codex:
        reasoning: low
        models:
          - {
              id: gpt-6-astra,
              contextWindow: 272000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
          - {
              id: gpt-6.1-sol,
              contextWindow: 500000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
          - {
              id: gpt-6-sol,
              contextWindow: 272000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
          - {
              id: gpt-6-luna,
              contextWindow: 272000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
          - {
              id: gpt-5.6-sol,
              contextWindow: 272000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
          - {
              id: gpt-5.6-terra,
              contextWindow: 272000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
          - {
              id: gpt-5.6-luna,
              contextWindow: 272000,
              maxTokens: 32768,
              reasoningEfforts: { low: low, medium: medium, high: high, xhigh: xhigh }
            }
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false

# ── Claude Code Desktop look & feel ─────────────────────────────────────────
# Warm dark palette first (the dsh-claude-ui plugin repaints the details).
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    textFontFamily: "Inter, Noto Sans, Segoe UI, system-ui, sans-serif"
    codeFontFamily: "JetBrains Mono, Noto Sans Mono, ui-monospace, monospace"
    terminalFontFamily: "JetBrains Mono, Noto Sans Mono, ui-monospace, monospace"

# In-app Browser tabs in the right sidebar (Web profiles opt in; Desktop has
# them by default). HTTP(S) pages, including loopback services.
- id: ui-sidebar-browser
  name: "@deepseek-ai/dsh-client-ui-sidebar-browser"
  disabled: false

# ── GitLab forge provider ───────────────────────────────────────────────────
# Merge-request panel (status/checks/diff/merge) for GitLab, read through the
# host glab CLI. The token lives in glab's own keyring, never in this file.
# gitlab.com is listed but stays "unauthenticated" until:
#   glab auth login --hostname gitlab.com
- id: dungsil-forge-gitlab
  name: "@dungsil/dsh-plugin-forge-gitlab"
  config:
    glabCommand: glab
    hosts: [ gitlab.example.com, gitlab.com ]
    timeoutMs: 30000
    maxOutputBytes: 8388608

# ── Model-callable browser (Playwright MCP) ─────────────────────────────────
# Adds mcp__playwright__* tools (25 schemas): navigate, click, type, screenshot,
# evaluate. Chromium is taken from the Playwright cache because the system
# /usr/bin/chromium is broken on this host (missing libsimdutf.so.36).
- insert:
    - id: mcp-playwright
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: playwright
        transport: stdio
        command: npx
        args:
          - "-y"
          - "@playwright/mcp@0.0.85"
          - "--headless"
          - "--isolated"
          - "--executable-path"
          - "/home/YOUR_USER/.cache/ms-playwright/chromium-1208/chrome-linux64/chr\
            ome"
          - "--viewport-size"
          - "1280x720"
          - "--output-dir"
          - "/tmp/dsh-playwright-mcp"
        toolCallTimeoutMs: 120000
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en

# ── Claude Code Desktop repaint (client plugin, CSS-only) ───────────────────
- insert:
    - id: claude-ui
      name: dsh-claude-ui
      config: {}

# ── Long-term memory (dsh-plugin-memory) ────────────────────────────────────
# Store: ~/.memory (markdown + git). Boot block (SOUL.md/MEMORY.md/index.md) is
# auto-injected at session start; "memory" skill and /memory commands are on.
# Freeze the boot snapshot per session so mid-session memory writes cannot
# invalidate the prompt-prefix cache.
- id: dsh-memory
  config:
    bootSnapshot: session

# ── MCP imported from opencode: global servers ──────────────────────────────
# (opencode's own playwright MCP is skipped: DSH already runs Playwright MCP
#  with the working Chromium; its cloudflare remote needs OAuth, unsupported.)
- insert:
    - id: mcp-context7
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        headers:
          CONTEXT7_API_KEY: !!js 'process.getBuiltinModule("node:fs").readFileSync(process.env.HOME
            + "/.config/opencode/secrets/context7-key", "utf8").trim()'
        toolCallTimeoutMs: 60000
    - id: mcp-grepapp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: grepapp
        transport: streamable-http
        url: https://mcp.grep.app
        toolCallTimeoutMs: 60000
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: codex
    model: gpt-6.2-sol
    reasoningEffort: medium

# ── Inline local bash: type !cmd + Enter, no model turn ─────────────────────
- insert:
    - id: inline-bash
      name: dsh-inline-bash
- id: notify-hook
  name: dsh-notification-hook
  config:
    enabled: true
    locale: auto
    logLevel: info
    events:
      completed: true
      failed: true
      awaitingInput: true
      attention: true
      cancelled: false
    includeSubagents: false
    minDurationMs: 10000
    awaitingInputDelayMs: 2500
    dedupeWindowMs: 3000
    desktop:
      enabled: true
      sound: true
      appId: ""
      timeoutMs: 10000
    webhooks: []
    timeoutMs: 8000
    retries: 1
    logDeliveries: true
    testOnActivate: false
# >>> model-tuning:standard-preset (generated by model-tuning/sync-standard-preset.mjs; edit via the script)
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          # Set false to drop the apply_patch tool beside edit.
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              thresholdRatio: 0.8
              headroomTokens: 32768
              retainRatio: 0.2
              maxTokens: 32768
              auto: true
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true
