# Static artifact host. Put published HTML files in /srv/dsh-share (read-only).
# Traefik routes Host(`${SHARE_HOST}`) to this container on port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals allow-downloads; default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri =404;
        autoindex off;
    }
}
